services:
  juux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juux
    restart: unless-stopped
    ports:
      - "100.105.212.24:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DROPBOX_DIR: /app/storage/dropbox
      DROP_PASSWORD: ${DROP_PASSWORD:?DROP_PASSWORD must be set in .env.prod}
      GOLF_DB_HOST: mysql
      GOLF_DB_PORT: 3306
      GOLF_DB_USER: root
      GOLF_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GOLF_DB_NAME: ${MYSQL_DATABASE:-golf}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./storage:/app/storage
    networks:
      - akke

networks:
  akke:
    external: true

