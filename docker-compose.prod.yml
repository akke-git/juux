services:
  juux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juux
    restart: unless-stopped
    ports:
      - "100.105.212.24:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DROPBOX_DIR: /app/storage/dropbox
      # 사이트 전체 로그인 비밀번호 (예전 이름 DROP_PASSWORD도 호환)
      SITE_PASSWORD: ${SITE_PASSWORD:-${DROP_PASSWORD:?SITE_PASSWORD must be set in .env.prod}}
      GOLF_DB_HOST: mysql
      GOLF_DB_PORT: 3306
      # golf DB 전용 계정(SELECT/INSERT/UPDATE/DELETE만). root는 쓰지 않는다
      GOLF_DB_USER: ${GOLF_DB_USER:?GOLF_DB_USER must be set in .env.prod}
      GOLF_DB_PASSWORD: ${GOLF_DB_PASSWORD:?GOLF_DB_PASSWORD must be set in .env.prod}
      GOLF_DB_NAME: ${MYSQL_DATABASE:-golf}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./storage:/app/storage
    networks:
      - akke

networks:
  akke:
    external: true

